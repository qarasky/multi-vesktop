name: test
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    test:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests
              if: runner.os == 'Linux'
              run: pnpm test

            # venmic is Linux-only; Windows still verifies actual Electron sessions
            # and the PowerShell script executed by the installer.
            - name: Test Windows storage and installer preservation
              if: runner.os == 'Windows'
              run: pnpm testStorage

            - name: Lint Windows build
              if: runner.os == 'Windows'
              run: pnpm lint

            - name: Test if it compiles
              run: |
                  pnpm build
                  pnpm build --dev
