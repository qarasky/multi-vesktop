name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

# electron-builder publishes the release with this token.
permissions:
    contents: write

jobs:
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      platform: mac
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: windows

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            # These builds are UNSIGNED.
            #   macOS: first launch needs right-click -> Open, or `xattr -dr com.apple.quarantine "/Applications/Multi Vesktop.app"`.
            #   Windows: SmartScreen shows an "unknown publisher" prompt.
            # To sign later, add repository secrets (CSC_LINK, CSC_KEY_PASSWORD and the
            # APPLE_* notarization vars) and pass them in the env block below, then set
            # build.mac.notarize back to true in package.json.
            - name: Package & publish
              run: pnpm electron-builder --${{ matrix.platform }} --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
