name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

# electron-builder publishes the release with this token.
permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            # Windows-only: a single NSIS installer (.exe). Unsigned, so
            # SmartScreen shows an "unknown publisher" prompt on first run.
            #
            # electron-builder publishes a DRAFT release: drafts are mutable, so
            # every asset lands in one release. We publish it in the next step.
            - name: Package & publish (draft)
              run: pnpm electron-builder --windows --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish release
              shell: bash
              run: |
                  TAG="v$(node -p "require('./package.json').version")"
                  gh release edit "$TAG" --draft=false --latest
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
