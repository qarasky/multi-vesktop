<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https: data:;"
        />
        <title>Accounts</title>
        <style>
            :root {
                --bar-bg: #1e1f22;
                --bar-border: #111214;
                --tab-hover: #2b2d31;
                --tab-active: #313338;
                --fg: #dbdee1;
                --fg-dim: #949ba4;
                --badge: #f23f43;
                --strip-height: 40px;
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --bar-bg: #f2f3f5;
                    --bar-border: #e3e5e8;
                    --tab-hover: #e9eaec;
                    --tab-active: #ffffff;
                    --fg: #2e3338;
                    --fg-dim: #5c5e66;
                }
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                height: var(--strip-height);
                overflow: hidden;
                background: transparent;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                font-size: 12px;
                color: var(--fg);
                user-select: none;
                -webkit-user-select: none;
            }

            img,
            .avatar {
                -webkit-user-drag: none;
                user-select: none;
            }

            #bar {
                display: flex;
                align-items: center;
                gap: 4px;
                height: var(--strip-height);
                padding: 0 8px;
                background: var(--bar-bg);
                border-bottom: 1px solid var(--bar-border);
                -webkit-app-region: drag;
            }

            #bar.darwin {
                padding-left: 78px;
            }

            #tabs {
                display: flex;
                align-items: center;
                gap: 4px;
                flex: 1;
                min-width: 0;
                overflow: hidden;
            }

            .tab {
                display: flex;
                align-items: center;
                gap: 7px;
                height: 28px;
                max-width: 190px;
                min-width: 92px;
                padding: 0 8px;
                border: 1px solid transparent;
                border-radius: 6px;
                cursor: default;
                color: var(--fg-dim);
                position: relative;
                transition: background 0.1s ease, border-color 0.1s ease, color 0.1s ease;
                -webkit-app-region: no-drag;
            }

            .tab:hover {
                background: var(--tab-hover);
                color: var(--fg);
            }

            .tab.active {
                background: var(--tab-active);
                color: var(--fg);
                border-color: var(--accent, #5865f2);
            }

            .tab.dragging {
                opacity: 0.4;
            }

            .tab.drop-before {
                border-left-color: var(--accent, #5865f2);
            }

            .tab.drop-after {
                border-right-color: var(--accent, #5865f2);
            }

            .avatar {
                width: 16px;
                height: 16px;
                border-radius: 50%;
                flex: 0 0 auto;
                object-fit: cover;
            }

            .label {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                flex: 1;
                min-width: 0;
            }

            .badge {
                flex: 0 0 auto;
                min-width: 16px;
                height: 16px;
                padding: 0 5px;
                border-radius: 8px;
                background: var(--badge);
                color: #fff;
                font-size: 10px;
                font-weight: 700;
                line-height: 16px;
                text-align: center;
            }

            .icon {
                flex: 0 0 auto;
                width: 14px;
                text-align: center;
                font-size: 12px;
                line-height: 1;
            }

            .close {
                flex: 0 0 auto;
                width: 16px;
                height: 16px;
                border-radius: 4px;
                border: none;
                background: transparent;
                color: inherit;
                font-size: 13px;
                line-height: 1;
                cursor: pointer;
                display: none;
                padding: 0;
            }

            .tab:hover .close,
            .tab.active .close {
                display: block;
            }

            .close:hover {
                background: rgba(255, 255, 255, 0.12);
            }

            #add {
                -webkit-app-region: no-drag;
                width: 26px;
                height: 26px;
                flex: 0 0 auto;
                border: none;
                border-radius: 6px;
                background: transparent;
                color: var(--fg-dim);
                font-size: 18px;
                line-height: 1;
                cursor: pointer;
            }

            #add:hover {
                background: var(--tab-hover);
                color: var(--fg);
            }

            .rename {
                flex: 1;
                min-width: 0;
                height: 20px;
                padding: 0 4px;
                border: 1px solid var(--accent, #5865f2);
                border-radius: 4px;
                background: var(--card, #2b2d31);
                color: var(--fg);
                font: inherit;
                outline: none;
            }

            .error-banner {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bar-bg);
                color: var(--fg);
            }
        </style>
    </head>
    <body>
        <div id="bar">
            <div id="tabs"></div>
            <button id="add" title="Add account">＋</button>
        </div>

        <script>
            const api = window.MultiVesktop;

            if (!api) {
                document.body.innerHTML = '<div class="error-banner">Tab strip failed to initialise (preload missing).</div>';
            } else {
                const tabsEl = document.getElementById("tabs");
                const addEl = document.getElementById("add");

                if (api.platform === "darwin") document.getElementById("bar").classList.add("darwin");

                let state = { activeId: null, tabs: [] };
                let dragId = null;

                const initial = s => (s || "?").trim().charAt(0).toUpperCase() || "?";

                function clearDropMarkers() {
                    for (const el of tabsEl.querySelectorAll(".drop-before, .drop-after")) {
                        el.classList.remove("drop-before", "drop-after");
                    }
                }

                function makeAvatar(tab) {
                    const image = tab.avatarUrl || tab.favicon;

                    if (image) {
                        const img = document.createElement("img");
                        img.className = "avatar";
                        img.src = image;
                        img.draggable = false;
                        img.onerror = () => img.replaceWith(makeInitialAvatar(tab));
                        return img;
                    }
                    return makeInitialAvatar(tab);
                }

                function makeInitialAvatar(tab) {
                    const div = document.createElement("div");
                    div.className = "avatar";
                    Object.assign(div.style, {
                        background: tab.color || "#5865f2",
                        color: "#fff",
                        fontSize: "10px",
                        fontWeight: "700",
                        lineHeight: "16px",
                        textAlign: "center"
                    });
                    div.textContent = initial(tab.displayName || tab.label);
                    return div;
                }

                function makeBadge(count) {
                    const badge = document.createElement("span");
                    badge.className = "badge";
                    badge.textContent = count > 99 ? "99+" : String(count);
                    return badge;
                }

                function startRename(labelEl, id, current) {
                    const input = document.createElement("input");
                    input.className = "rename";
                    input.value = current;
                    labelEl.replaceWith(input);
                    input.focus();
                    input.select();

                    let done = false;
                    const commit = async save => {
                        if (done) return;
                        done = true;
                        if (save && input.value.trim()) await api.rename(id, input.value);
                        await refresh();
                    };

                    input.addEventListener("keydown", e => {
                        if (e.key === "Enter") commit(true);
                        else if (e.key === "Escape") commit(false);
                    });
                    input.addEventListener("blur", () => commit(true));
                    input.addEventListener("click", e => e.stopPropagation());
                    input.addEventListener("dblclick", e => e.stopPropagation());
                }

                function render() {
                    tabsEl.textContent = "";

                    for (const tab of state.tabs) {
                        const el = document.createElement("div");
                        el.className = "tab" + (tab.id === state.activeId ? " active" : "");
                        el.title = tab.title || tab.displayName || tab.label;
                        el.style.setProperty("--accent", tab.color || "#5865f2");
                        el.draggable = true;

                        el.appendChild(makeAvatar(tab));

                        const label = document.createElement("span");
                        label.className = "label";
                        label.textContent = tab.displayName || tab.label;
                        el.appendChild(label);

                        if (tab.crashed) {
                            const icon = document.createElement("span");
                            icon.className = "icon";
                            icon.textContent = "⚠";
                            icon.title = "This account crashed";
                            el.appendChild(icon);
                        } else if (tab.audible) {
                            const icon = document.createElement("span");
                            icon.className = "icon";
                            icon.textContent = "🔊";
                            icon.title = "Playing audio";
                            el.appendChild(icon);
                        }

                        if (tab.unread > 0) el.appendChild(makeBadge(tab.unread));

                        const close = document.createElement("button");
                        close.className = "close";
                        close.textContent = "×";
                        close.title = "Close account";
                        close.addEventListener("click", e => {
                            e.stopPropagation();
                            api.close(tab.id).then(refresh);
                        });
                        el.appendChild(close);

                        el.addEventListener("click", () => api.select(tab.id));
                        el.addEventListener("auxclick", e => {
                            if (e.button === 1) api.close(tab.id).then(refresh);
                        });
                        el.addEventListener("dblclick", e => {
                            e.stopPropagation();
                            startRename(label, tab.id, tab.label);
                        });
                        el.addEventListener("contextmenu", e => {
                            e.preventDefault();
                            api.openDevtools(tab.id);
                        });

                        el.addEventListener("dragstart", e => {
                            dragId = tab.id;
                            e.dataTransfer.effectAllowed = "move";
                            e.dataTransfer.setData("text/plain", tab.id);
                            el.classList.add("dragging");
                        });
                        el.addEventListener("dragend", () => {
                            dragId = null;
                            el.classList.remove("dragging");
                            clearDropMarkers();
                            // apply any state updates we skipped while dragging
                            render();
                        });
                        el.addEventListener("dragover", e => {
                            if (!dragId || dragId === tab.id) return;
                            e.preventDefault();
                            e.dataTransfer.dropEffect = "move";
                            clearDropMarkers();
                            const rect = el.getBoundingClientRect();
                            el.classList.add(e.clientX > rect.left + rect.width / 2 ? "drop-after" : "drop-before");
                        });
                        el.addEventListener("drop", e => {
                            e.preventDefault();
                            const after = el.classList.contains("drop-after");
                            clearDropMarkers();
                            if (!dragId || dragId === tab.id) return;

                            // index among the other accounts, matching moveAccount()'s post-removal splice
                            const rest = state.tabs.map(t => t.id).filter(id => id !== dragId);
                            const target = rest.indexOf(tab.id);
                            if (target === -1) return;

                            api.move(dragId, target + (after ? 1 : 0));
                            dragId = null;
                        });

                        tabsEl.appendChild(el);
                    }
                }

                async function refresh() {
                    state = api.getState();
                    if (!dragId) render();
                }

                addEl.addEventListener("click", async () => {
                    const account = await api.create();
                    await refresh();

                    const tabEl = tabsEl.lastElementChild;
                    const labelEl = tabEl && tabEl.querySelector(".label");
                    if (labelEl && account) startRename(labelEl, account.id, account.label);
                });

                api.onState(next => {
                    state = next;
                    // Never rebuild the DOM mid-drag: it cancels the drag.
                    if (!dragId) render();
                });

                refresh();
            }
        </script>
    </body>
</html>
